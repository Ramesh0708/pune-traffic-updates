name: Pune Traffic Updates

on:
  schedule:
    - cron: '0 3 * * *'    # 08:30 AM IST daily (UTC 03:00)
    - cron: '30 10 * * *'  # 04:00 PM IST daily (UTC 10:30)
  workflow_dispatch:       # allow manual runs

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Run Traffic Updates Script
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python pune_traffic_alerts.py
